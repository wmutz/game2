<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sneaky Neighbor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="600"></canvas>

  <div id="prompt" class="hidden"></div>

  <div id="inventory-panel" class="hidden">
    <div id="inventory-title">Bag</div>
    <div id="inventory-list"></div>
  </div>

  <div id="menu-panel" class="hidden">
    <div id="menu-header">
      <div id="menu-title">Menu</div>
      <button id="menu-close-btn">Close</button>
    </div>
    <div id="menu-list"></div>
  </div>

  <div id="controls">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
    <button id="interact-btn">A</button>
    <button id="inventory-btn">Bag</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
